<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - KAS Tour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- LOGIN -->
  <div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🔐</div>
        <h1 class="text-xl font-bold text-blue-900">Dashboard Admin</h1>
        <p class="text-sm text-gray-500">KAS Tour & Travel</p>
      </div>
      <form id="loginForm" class="space-y-3">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 rounded-lg transition">
          Masuk
        </button>
        <p id="loginError" class="text-red-500 text-sm text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardPage" class="hidden">
    <nav class="bg-blue-900 text-white shadow-lg sticky top-0 z-40">
      <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain">
          <span class="font-bold">Dashboard</span>
        </div>
        <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg">
          Keluar
        </button>
      </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4">
      <h1 class="text-xl font-bold text-blue-900 mb-4">Data Jamaah</h1>

      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="bg-white rounded-lg shadow p-3 text-center">
          <p class="text-2xl font-bold text-blue-900" id="totalJamaah">0</p>
          <p class="text-xs text-gray-600">Total Jamaah</p>
        </div>
        <div class="bg-white rounded-lg shadow p-3 text-center">
          <p class="text-2xl font-bold text-yellow-600" id="totalBaru">0</p>
          <p class="text-xs text-gray-600">Pendaftar Baru</p>
        </div>
      </div>

      <input type="text" id="searchInput" placeholder="Cari nama atau No HP..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-3">

      <div id="listJamaah" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ytqnqdqraasvdyelixiw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mLKOY4rvhTxHTCIIntijQ_PF4Hc8xJ';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allData = [];

    // Password admin (GANTI INI kalau perlu)
    const ADMIN_PASSWORD = 'kas2026admin';

    // Cek session (pakai localStorage, simpel)
    function cekSession() {
      if (localStorage.getItem('kas_admin') === 'true') {
        tampilkanDashboard();
      } else {
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('dashboardPage').classList.add('hidden');
      }
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');

      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem('kas_admin', 'true');
        errEl.classList.add('hidden');
        tampilkanDashboard();
      } else {
        errEl.textContent = 'Password salah!';
        errEl.classList.remove('hidden');
      }
    });

    // Logout
    function logout() {
      localStorage.removeItem('kas_admin');
      location.reload();
    }

    // Tampilkan dashboard
    async function tampilkanDashboard() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('dashboardPage').classList.remove('hidden');
      await loadData();
    }

    // Load data jamaah
    async function loadData() {
      const container = document.getElementById('listJamaah');
      container.innerHTML = '<p class="text-center text-gray-500">Memuat data...</p>';

      const { data, error } = await db.from('pendaftaran').select('*').order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p class="text-red-500 text-center">Error: ' + error.message + '</p>';
        return;
      }

      allData = data || [];
      document.getElementById('totalJamaah').textContent = allData.length;
      document.getElementById('totalBaru').textContent = allData.filter(j => j.status === 'baru').length;

      renderList(allData);
    }

    // Render list
    function renderList(data) {
      const container = document.getElementById('listJamaah');
      
      if (data.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-8">Belum ada pendaftar</p>';
        return;
      }

      container.innerHTML = data.map(item => {
        const tgl = new Date(item.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        const waLink = 'https://wa.me/' + (item.no_hp || '').replace(/^0/, '62').replace(/[^0-9]/g, '');
        
        return `
          <div class="bg-white rounded-lg shadow p-4">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h3 class="font-bold text-blue-900">${item.nama_lengkap}</h3>
                <p class="text-xs text-gray-500">${tgl}</p>
              </div>
              <span class="text-xs px-2 py-1 rounded-full ${item.status === 'baru' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">
                ${item.status || 'baru'}
              </span>
            </div>
            <div class="text-sm text-gray-700 space-y-1 mb-3">
              <p>📱 ${item.no_hp || '-'}</p>
              <p>🕌 ${item.nama_paket || '-'}</p>
              <p>🆔 NIK: ${item.nik || '-'}</p>
            </div>
            <div class="flex gap-2">
              <a href="${waLink}" target="_blank" class="flex-1 text-center bg-green-500 hover:bg-green-600 text-white font-bold py-2 rounded-lg text-sm">
                💬 WA
              </a>
              <button onclick="hapusData('${item.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg text-sm">
                🗑️
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Hapus data
    async function hapusData(id) {
      if (!confirm('Yakin hapus data ini?')) return;
      const { error } = await db.from('pendaftaran').delete().eq('id', id);
      if (error) {
        alert('Gagal hapus: ' + error.message);
        return;
      }
      await loadData();
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allData.filter(j => 
        (j.nama_lengkap || '').toLowerCase().includes(q) ||
        (j.no_hp || '').toLowerCase().includes(q)
      );
      renderList(filtered);
    });

    // Init
    cekSession();
  </script>

</body>
</html>
